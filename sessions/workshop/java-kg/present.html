<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Java Workshop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/dist/theme/beige.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/plugin/highlight/monokai.css">
    <style>
        .corner-logo {
        position: fixed;
        bottom: 100px;   /* anchor to bottom */
        right: 50px;    /* anchor to right */
        width: 100px;   /* bigger size */
        height: auto;   /* maintain aspect ratio */
        z-index: 1000;  /* keep above slide content */
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section data-markdown="java-workshop.md"
                 data-separator="^---$"
                 data-separator-vertical="^--$"
                 data-separator-notes="^Note:">
        </section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js/plugin/highlight/highlight.js"></script>
    <script>
      Reveal.initialize({
        hash: true,
        //center: false,
        plugins: [ RevealMarkdown, RevealHighlight, ]
        
      });

    </script>

  </body>
</html>
